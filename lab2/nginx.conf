log_format json_access escape=json '{"@timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    access_log /var/log/nginx/access.json json_access;
    error_log /var/log/nginx/error.log warn;
    location / {
        default_type text/html;
        return 200 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Lab 2</title><h1>Лабораторная 2</h1></html>';
    }
}
