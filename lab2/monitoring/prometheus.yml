global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: opensearch
    scheme: https
    metrics_path: /_prometheus/metrics
    scrape_timeout: 12s
    basic_auth:
      username: monitor
      password_file: /etc/prometheus/password
    tls_config:
      ca_file: /etc/prometheus/ca.pem
    static_configs:
      - targets: [hot:9200, warm:9200]
