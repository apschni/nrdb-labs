name: nrdb-lab2

x-node: &node
  build: .
  image: nrdb-lab2-opensearch:3.8.0
  environment:
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, "curl --silent --cacert config/certs/ca.pem https://localhost:9200/ -o /dev/null -w '%{http_code}' | grep -q 401"]
    interval: 15s
    timeout: 10s
    start_period: 180s
    retries: 40

services:
  hot:
    <<: *node
    networks:
      default:
        ipv4_address: 172.30.82.10
    volumes:
      - ./runtime/hot.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./runtime/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./runtime/certs/hot:/usr/share/opensearch/config/certs:ro
      - ./runtime/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - hot-data:/usr/share/opensearch/data
    ports:
      - 127.0.0.1:9200:9200

  warm:
    <<: *node
    networks:
      default:
        ipv4_address: 172.30.82.11
    volumes:
      - ./runtime/warm.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./runtime/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./runtime/certs/warm:/usr/share/opensearch/config/certs:ro
      - ./runtime/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - warm-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    volumes:
      - ./runtime/dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ./runtime/pki/ca.pem:/usr/share/opensearch-dashboards/config/ca.pem:ro
    ports:
      - 5601:5601
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    ports:
      - 8080:80
    restart: unless-stopped

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    environment:
      LS_JAVA_OPTS: -Xms192m -Xmx192m
      PIPELINE_WORKERS: 1
      PIPELINE_BATCH_SIZE: 50
      PIPELINE_ECS_COMPATIBILITY: disabled
      QUEUE_TYPE: persisted
      QUEUE_MAX_BYTES: 128mb
    env_file: ./runtime/logstash.env
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./runtime/pki/ca.pem:/usr/share/logstash/config/ca.pem:ro
      - nginx-logs:/logs:ro
      - logstash-data:/usr/share/logstash/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/prometheus-password:/etc/prometheus/password:ro
      - ./runtime/pki/ca.pem:/etc/prometheus/ca.pem:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    env_file: ./runtime/grafana.env
    volumes:
      - ./monitoring/grafana.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./monitoring/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/opensearch.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    restart: unless-stopped

  load:
    image: grafana/k6:1.3.0
    profiles: [tools]
    mem_limit: 192m
    volumes:
      - ./monitoring/load.js:/load.js:ro
    command: [run, /load.js]


volumes:
  hot-data:
  warm-data:
  nginx-logs:
  logstash-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.82.0/24
